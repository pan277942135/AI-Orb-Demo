name: AI Orb V3.2 High-Fidelity Final Closure CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-v32-final-closure:
    name: Verify V3.2 Master Lock, Offline Gates, Negative CI Tests, Unit Tests & Exact-HEAD APK
    runs-on: ubuntu-latest
    env:
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout Exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install ffmpeg for Lossless RGBA WebP Verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up repository Gradle version
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Sole Frozen Master PNG SHA-256
        run: |
          EXPECTED="910d15313b39ee2afa277356c46290e2cb7739b80a60e9ab4efaa14a29d74122"
          ACTUAL=$(sha256sum public/assets/aistudio/____________910d1531.png | awk '{print $1}')
          echo "Master SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Validate WebP Assets, Volume Continuity, Strict Fit Gates & 10 Negative CI Tests
        run: |
          python3 tools/orb-v3-generator/validate_webp_assets.py
          python3 tools/orb-v3-generator/validate_volume_continuity.py
          python3 tools/orb-v3-generator/fitting/validate_fit.py
          python3 tools/orb-v3-generator/test_v32_closure_gates.py

      - name: Validate Tab 2 V2 source lock and runtime texture inputs
        run: python3 tools/tab2-perimeter/package_v25.py

      - name: Compile, Run All JVM/Robolectric Tests & Assemble Debug APK
        run: |
          ACTUAL_HEAD=$(git rev-parse HEAD)
          echo "Exact source HEAD: $ACTUAL_HEAD"
          test "$ACTUAL_HEAD" = "$EXACT_HEAD_SHA"
          gradle :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug --console=plain

      - name: Package Exact-HEAD Final Debug APK & Verify Embedded APK Assets SHA-256
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AI-Orb-Demo-V3.2-HighFidelity-Final-debug.apk
          sha256sum AI-Orb-Demo-V3.2-HighFidelity-Final-debug.apk > AI-Orb-Demo-V3.2-HighFidelity-Final-debug.apk.sha256
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path

          apk_path = Path("AI-Orb-Demo-V3.2-HighFidelity-Final-debug.apk")
          manifest = json.loads(Path("app/src/main/assets/orb_v3/manifest/ORB_V3_ASSET_MANIFEST.json").read_text())
          master_cfg_bytes = Path("app/src/main/assets/orb_v3/manifest/MASTER_FIDELITY_V32.json").read_bytes()
          master_cfg_sha = hashlib.sha256(master_cfg_bytes).hexdigest()

          expected_entries = [
              ("assets/orb_v3/manifest/MASTER_FIDELITY_V32.json", master_cfg_sha),
          ]
          for s in manifest["volume"]["slices"]:
              expected_entries.append((f"assets/orb_v3/{s['path']}", s["sha256"]))
          for m in manifest["maps"]:
              expected_entries.append((f"assets/orb_v3/{m['path']}", m["sha256"]))

          with zipfile.ZipFile(apk_path, "r") as zf:
              for zpath, exp_sha in expected_entries:
                  actual_sha = hashlib.sha256(zf.read(zpath)).hexdigest()
                  assert actual_sha == exp_sha, f"APK asset mismatch: {zpath} {actual_sha} != {exp_sha}"
          print(f"[CI] Verified all {len(expected_entries)} APK assets (35 WebP + MASTER_FIDELITY_V32.json) match disk SHA-256!")
          PY

      - name: Emit Exact-HEAD BUILD_FINGERPRINT.json & SHA256SUMS
        run: |
          APK_SHA=$(awk '{print $1}' AI-Orb-Demo-V3.2-HighFidelity-Final-debug.apk.sha256)
          CFG_SHA=$(sha256sum app/src/main/assets/orb_v3/manifest/MASTER_FIDELITY_V32.json | awk '{print $1}')
          cat > docs/v3/BUILD_FINGERPRINT.json <<EOF
          {
            "schema": "AI_ORB_V3_2_EXACT_HEAD_BUILD_FINGERPRINT_1_0",
            "taskId": "AI_ORB_V32_FINAL_FIDELITY_CLOSURE_V2",
            "gitCommitSha": "${EXACT_HEAD_SHA}",
            "githubRunId": "${GITHUB_RUN_ID}",
            "githubRef": "${GITHUB_REF}",
            "referenceMasterSha256": "910d15313b39ee2afa277356c46290e2cb7739b80a60e9ab4efaa14a29d74122",
            "masterFidelityV32Sha256": "${CFG_SHA}",
            "apkFile": "AI-Orb-Demo-V3.2-HighFidelity-Final-debug.apk",
            "apkSha256": "${APK_SHA}",
            "gpuCaptureStatus": "PENDING_REAL_GPU_CAPTURE"
          }
          EOF
          sha256sum \
            AI-Orb-Demo-V3.2-HighFidelity-Final-debug.apk \
            public/assets/aistudio/____________910d1531.png \
            app/src/main/assets/orb_v3/manifest/MASTER_FIDELITY_V32.json \
            app/src/main/assets/orb_v3/manifest/ORB_V3_ASSET_MANIFEST.json \
            docs/v3/AI_ORB_V3_2_VISUAL_LOSS.json \
            docs/v3/BUILD_FINGERPRINT.json > docs/v3/AI_ORB_V3_2_FINAL_V2_SHA256SUMS
          cat docs/v3/AI_ORB_V3_2_FINAL_V2_SHA256SUMS

      - name: Upload Exact-HEAD Final APK & Closure Evidence Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-orb-v32-final-closure-exact-head
          path: |
            AI-Orb-Demo-V3.2-HighFidelity-Final-debug.apk
            AI-Orb-Demo-V3.2-HighFidelity-Final-debug.apk.sha256
            docs/v3/BUILD_FINGERPRINT.json
            docs/v3/AI_ORB_V3_2_*
            tools/orb-v3-generator/fitting/FIT_VALIDATION_RESULT.json

      - name: Package Tab 2 V2.5 Exact-HEAD APK and fingerprint
        env:
          EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tools/tab2-perimeter/package_v25.py \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --out dist/tab2-v25

      - name: Upload Tab 2 V2.5 Exact-HEAD APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tab2-v25-perimeter-exact-head
          path: dist/tab2-v25/*
          if-no-files-found: error
