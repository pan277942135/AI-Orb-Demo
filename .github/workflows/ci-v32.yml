name: AI Orb V3.2 High-Fidelity CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-v32-fidelity:
    name: Verify V3.2 Assets, Fitting, Unit Tests & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Sole Frozen Master SHA-256
        run: |
          EXPECTED="910d15313b39ee2afa277356c46290e2cb7739b80a60e9ab4efaa14a29d74122"
          ACTUAL=$(sha256sum public/assets/aistudio/____________910d1531.png | awk '{print $1}')
          echo "Master SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Validate WebP Assets, Volume Continuity & V3.2 Fitting Contracts
        run: |
          python3 tools/orb-v3-generator/validate_webp_assets.py
          python3 tools/orb-v3-generator/validate_volume_continuity.py
          python3 tools/orb-v3-generator/fitting/validate_fit.py

      - name: Run Unit & Robolectric Tests + Assemble Debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain

      - name: Package Candidate APK & Compute SHA-256
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AI-Orb-Demo-V3.2-HighFidelity-debug.apk
          sha256sum \
            AI-Orb-Demo-V3.2-HighFidelity-debug.apk \
            public/assets/aistudio/____________910d1531.png \
            app/src/main/assets/orb_v3/manifest/MASTER_FIDELITY_V32.json \
            app/src/main/assets/orb_v3/manifest/ORB_V3_ASSET_MANIFEST.json \
            docs/v3/AI_ORB_V3_2_VISUAL_LOSS.json > AI_ORB_V3_2_SHA256SUMS
          cat AI_ORB_V3_2_SHA256SUMS

      - name: Upload Candidate APK & Evidence Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-orb-v32-high-fidelity-candidate
          path: |
            AI-Orb-Demo-V3.2-HighFidelity-debug.apk
            AI_ORB_V3_2_SHA256SUMS
            docs/v3/AI_ORB_V3_2_*
            AI_ORB_V3_REFERENCE_COMPARISON.png
