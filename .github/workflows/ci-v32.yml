          grep -Eni 'GL error|GL_INVALID|GL_OUT_OF_MEMORY|shader compile failed|FATAL EXCEPTION|ANR in' "$OUT/logs/tab3_logcat.txt" > "$OUT/logs/gl_or_runtime_errors.txt" || true

      - name: API36_TAB3_CONTINUOUS_20S_MOTION_VIDEO
        env:
          APP_ID: com.aistudio.aiorbdemo.vxkrmq
        shell: bash
        run: |
          set -euo pipefail
          OUT=p0_3_evidence/yujian_tab3
          mkdir -p "$OUT/logs"
          adb shell am force-stop "$APP_ID"
          adb shell run-as "$APP_ID" rm -f files/tab3_hybrid/TAB3_MOTION_STARTED
          timeout 900s adb shell am instrument -w -r \
            -e class com.example.YuJianHybridTab3Api36Test#thirdTabKeepsTheSharedCoreClockMovingForTwentySeconds \
            "$APP_ID.test/androidx.test.runner.AndroidJUnitRunner" \
            > "$OUT/logs/tab3_motion_instrumentation.txt" 2>&1 &
          TEST_PID=$!
          MARKER_READY=0
          for attempt in $(seq 1 120); do
            if adb shell run-as "$APP_ID" test -f files/tab3_hybrid/TAB3_MOTION_STARTED; then
              MARKER_READY=1
              break
            fi
            if ! kill -0 "$TEST_PID" 2>/dev/null; then
              cat "$OUT/logs/tab3_motion_instrumentation.txt"
              exit 1
            fi
            sleep 1
          done
          test "$MARKER_READY" -eq 1
          timeout --foreground --signal=TERM --kill-after=15s 600s adb shell screenrecord \
            --size 720x720 --bit-rate 4000000 --time-limit 24 /sdcard/AI_ORB_DEMO_TAB3_FINAL_20S.mp4 \
            > "$OUT/logs/tab3_screenrecord.log" 2>&1
          wait "$TEST_PID"
          cat "$OUT/logs/tab3_motion_instrumentation.txt"
          grep -q 'OK (1 test)' "$OUT/logs/tab3_motion_instrumentation.txt"
          adb exec-out run-as "$APP_ID" cat files/tab3_hybrid/TAB3_MOTION_20S_RUNTIME.json > "$OUT/captures/TAB3_MOTION_20S_RUNTIME.json"
          adb pull /sdcard/AI_ORB_DEMO_TAB3_FINAL_20S.mp4 "$OUT/AI_ORB_DEMO_TAB3_FINAL_20S.mp4"
          python3 tools/orb-yujian-tab3/validate_runtime_evidence.py \
            --evidence-dir "$OUT/captures" \
            --video "$OUT/AI_ORB_DEMO_TAB3_FINAL_20S.mp4" \
            --expected-head "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output "$OUT/TAB3_HYBRID_VISUAL_ACCEPTANCE_REPORT.json"

      - name: Assemble YuJian hybrid delivery evidence
        if: always()
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          OUT=AI_ORB_DEMO_TAB3_REFB_OUTER_OPTICAL_FIELD_V1_DELIVERY
          mkdir -p "$OUT/implementation" "$OUT/source_audit" "$OUT/reports" "$OUT/simulator_evidence" "$OUT/video" "$OUT/APK" \
            "$OUT/round_1" "$OUT/round_2" "$OUT/round_3" "$OUT/visual_comparison"
          cp yujian-head/docs/yujian_hybrid/YUJIAN_ORB_SOURCE_MANIFEST.json "$OUT/source_audit/" || true
          cp yujian-head/docs/yujian_hybrid/YUJIAN_CORE_EXTRACTION_AUDIT.md "$OUT/source_audit/" || true
          cp yujian-head/docs/yujian_hybrid/TAB3_HYBRID_RENDER_ARCHITECTURE.md "$OUT/source_audit/" || true
          cp app/src/main/assets/outer_optical_field/OUTER_OPTICAL_FIELD_RUNTIME_V1.json "$OUT/implementation/"
          cp app/src/main/java/com/example/orb/outer/OuterOpticalFieldRenderer.kt "$OUT/implementation/"
          cp -R AI_ORB_DEMO_TAB3_REFB_OUTER_OPTICAL_FIELD_V1/ref_b_extraction "$OUT/"
          cp -R AI_ORB_DEMO_TAB3_REFB_OUTER_OPTICAL_FIELD_V1/outer_optical_field_contract "$OUT/"
          cp -R AI_ORB_DEMO_TAB3_REFB_OUTER_OPTICAL_FIELD_V1/source_audit "$OUT/"
          cp AI_ORB_DEMO_TAB3_REFB_OUTER_OPTICAL_FIELD_V1/implementation/OUTER_OPTICAL_FIELD_ARCHITECTURE.md "$OUT/implementation/"
          cp AI_ORB_DEMO_TAB3_REFB_OUTER_OPTICAL_FIELD_V1/reports/AI_ORB_DEMO_TAB3_REFB_ACCEPTANCE_MATRIX.md "$OUT/reports/"
          cp yujian-head/AI-Orb-Demo-YuJian-Hybrid-Debug.apk "$OUT/APK/AI-Orb-Demo-V4.2-Tab3-REFB-Outer-Optical-Field-debug.apk" || true
          cp yujian-head/docs/yujian_hybrid/BUILD_FINGERPRINT.json "$OUT/BUILD_FINGERPRINT.json" || true
          if [ -s "$OUT/APK/AI-Orb-Demo-V4.2-Tab3-REFB-Outer-Optical-Field-debug.apk" ]; then
            export APK_SHA=$(sha256sum "$OUT/APK/AI-Orb-Demo-V4.2-Tab3-REFB-Outer-Optical-Field-debug.apk" | awk '{print $1}')
            export APK_BYTES=$(stat -c%s "$OUT/APK/AI-Orb-Demo-V4.2-Tab3-REFB-Outer-Optical-Field-debug.apk")
            export EXPECTED_HEAD_SHA GITHUB_RUN_ID GITHUB_REF GITHUB_SERVER_URL GITHUB_REPOSITORY
            python3 - "$OUT/BUILD_FINGERPRINT.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          base = json.loads(Path(sys.argv[1]).read_text())
          base.update({
              "taskId": "AI_ORB_DEMO_TAB3_REFB_OUTER_OPTICAL_FIELD_REBUILD_V1",
              "gitCommitSha": os.environ["EXPECTED_HEAD_SHA"],
              "githubRunId": os.environ["GITHUB_RUN_ID"],
              "githubRef": os.environ["GITHUB_REF"],
              "ciRunUrl": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "apkFile": "AI-Orb-Demo-V4.2-Tab3-REFB-Outer-Optical-Field-debug.apk",
              "apkSha256": os.environ["APK_SHA"],
              "apkSizeBytes": int(os.environ["APK_BYTES"]),
              "outerOpticalStatus": "API36_AVD_CAPTURED; software renderer classification in simulator evidence",
              "visualFidelityAccepted": False,
              "hardwareGpuAcceptance": "NOT_CLAIMED"
          })
          Path(sys.argv[1]).write_text(json.dumps(base, indent=2) + "\n")
          PY
          fi
          cp p0_3_evidence/yujian_tab3/TAB3_HYBRID_VISUAL_ACCEPTANCE_REPORT.json "$OUT/reports/" || true
          cp p0_3_evidence/yujian_tab3/captures/RUNTIME_TELEMETRY.json "$OUT/reports/FINAL_RUNTIME_TELEMETRY.json" || true
          cp p0_3_evidence/yujian_tab3/AI_ORB_DEMO_TAB3_FINAL_20S.mp4 "$OUT/video/" || true
          cp -R p0_3_evidence/yujian_tab3 "$OUT/simulator_evidence/" || true
          if [ -s "$OUT/simulator_evidence/yujian_tab3/captures/TAB3_HYBRID_ORB_GPU.png" ]; then
            python3 tools/orb-tab3-refb/compare_outer_field_gpu.py \
              --captures "$OUT/simulator_evidence/yujian_tab3/captures" --output "$OUT" \
              --head "$EXPECTED_HEAD_SHA"
          else
            cat > "$OUT/round_1/ROUND_1_REPORT.json" <<'JSON'
          {"round":1,"status":"ROUND_1_NO_VERIFIABLE_PROGRESS","reason":"No real API36 Tab3 capture was produced; no visual improvement or GPU pass is claimed."}
          JSON
            cat > "$OUT/round_2/ROUND_2_REPORT.json" <<'JSON'
          {"status":"NOT_RUN","reason":"Round 1 produced no comparable GPU image evidence."}
          JSON
            cat > "$OUT/round_3/ROUND_3_REPORT.json" <<'JSON'
          {"status":"NOT_RUN","reason":"Round 2 was not eligible because Round 1 produced no verifiable progress."}
          JSON
          fi
          python3 - "$OUT" "$EXPECTED_HEAD_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          head = sys.argv[2]
          runtime_path = Path("p0_3_evidence/yujian_tab3/TAB3_HYBRID_VISUAL_ACCEPTANCE_REPORT.json")
          runtime = json.loads(runtime_path.read_text()) if runtime_path.is_file() else None
          round_path = root / "round_1/ROUND_1_REPORT.json"
          round1 = json.loads(round_path.read_text()) if round_path.is_file() else {"status": "ROUND_1_NO_VERIFIABLE_PROGRESS"}
          apk_path = root / "APK/AI-Orb-Demo-V4.2-Tab3-REFB-Outer-Optical-Field-debug.apk"
          build = json.loads((root / "BUILD_FINGERPRINT.json").read_text()) if (root / "BUILD_FINGERPRINT.json").is_file() else {}
          runtime_status = "PASS" if runtime and runtime.get("status") == "PASS_SOFTWARE_AVD_RUNTIME_AND_VIDEO" else "FAIL_OR_NOT_RUN"
          core_status = "PASS" if runtime and runtime.get("runtimeFacts", {}).get("yujianCoreStatus") == "RENDERED" else "FAIL_OR_NOT_RUN"
          outer_status = "PASS" if runtime and runtime.get("runtimeFacts", {}).get("outerOpticalStatus") == "RENDERED" else "FAIL_OR_NOT_RUN"
          rows = [
              ("REF_B_EXTRACTION_PASS", "PASS", "Frozen REF_B SHA, P0-A extraction gate, 13 regions, and 12 masks."),
              ("SOURCE_IMPLEMENTATION_COMPLETE", outer_status, "Tab 3-only renderer status and exact manifest/shader telemetry from API36 instrumentation."),
              ("YUJIAN_CORE_INTEGRATION_PASS", core_status, "Production YuJian source shader reported rendered on the API36 AVD."),
              ("OUTER_OPTICAL_FIELD_RUNTIME_PASS", outer_status, "Runtime draws, program IDs, manifest SHA, and GL status from the API36 AVD."),
              ("ROUND_1_PROGRESS", round1.get("status", "ROUND_1_NO_VERIFIABLE_PROGRESS"), "Only the frozen resident-mask comparison is measured; full scene acceptance remains separate."),
              ("ROUND_2", "NOT_RUN", "A further round needs a source-backed correction and must pass its own progress gate."),
              ("ROUND_3", "NOT_RUN", "A further round needs a source-backed correction and must pass its own progress gate."),
              ("API36_AVD_PASS", runtime_status, "CI AVD uses SwiftShader software GLES; this is not hardware GPU evidence."),
              ("TAB1_TAB2_RUNTIME_ISOLATION", "TAB1_PATH_PASS; TAB2_SWITCH_PASS; TAB2_PIXEL_PARITY_NOT_CAPTURED", "Tab 1 baseline capture and three-tab switch test ran; no Tab 2 pixel parity claim."),
              ("EXACT_HEAD_CI_PASS", "PASS", f"This AVD job depends on successful exact-HEAD build/test job; HEAD {head}."),
              ("EXACT_HEAD_APK_DELIVERED", "PASS" if apk_path.is_file() else "FAIL_OR_NOT_RUN", f"{build.get('apkFile', 'APK missing')}; SHA-256 {build.get('apkSha256', 'UNAVAILABLE')}; {build.get('apkSizeBytes', 0)} bytes."),
              ("HARDWARE_GPU_RENDER_VERIFIED", "NOT_RUN", "Software AVD output cannot satisfy hardware GPU verification."),
              ("VISUAL_FIDELITY_ACCEPTED", "NOT_ACCEPTED", "Only a source-aligned resident-mask progress comparison is available; all 13 frozen regions and manual review are not accepted."),
              ("USER_DEVICE_QA", "PENDING_USER_DEVICE_QA", "Final installation and review remains on HUAWEI CMS-AL20 / Android 16."),
          ]
          lines = ["# AI Orb Demo Tab 3 REF_B Acceptance Matrix", "", f"- Exact HEAD: `{head}`", "- Source: frozen REF_B, SHA-256 `910d15313b39ee2afa277356c46290e2cb7739b80a60e9ab4efaa14a29d74122`", "- Renderer: API36 x86_64 AVD / software GLES; no hardware GPU claim.", "", "| Gate | Status | Evidence / limit |", "|---|---|---|"]
          lines.extend(f"| `{key}` | **{status}** | {note} |" for key, status, note in rows)
          (root / "reports/AI_ORB_DEMO_TAB3_REFB_ACCEPTANCE_MATRIX.md").write_text("\n".join(lines) + "\n")
          PY
          cat > "$OUT/reports/FINAL_ACCEPTANCE_REPORT.md" <<EOF
          # Tab 3 REF_B Outer Optical Field Acceptance

          - Exact source HEAD: \`${EXPECTED_HEAD_SHA}\`
          - CI run: \${GITHUB_SERVER_URL}/\${GITHUB_REPOSITORY}/actions/runs/\${GITHUB_RUN_ID}
          - Render backend: API36 x86_64 AVD / software GLES (SwiftShader); this does not claim hardware GPU validation.
          - Reference: frozen REF_B SHA-256 910d15313b39ee2afa277356c46290e2cb7739b80a60e9ab4efaa14a29d74122.
          - Round 1: see round_1/ROUND_1_METRICS.json; the gate records measured progress or ROUND_1_NO_VERIFIABLE_PROGRESS.
          - Round 2 and Round 3: NOT_RUN unless the prior round has measurable progress and a source-backed correction.
          - Hardware GPU fidelity acceptance: NOT_RUN.
          - Full visual fidelity: NOT_ACCEPTED by build success alone; frozen 13-region review and real-device review remain required.
          EOF
          python3 - "$OUT" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          records = {}
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "SHA256SUMS.json":
                  records[path.relative_to(root).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / "SHA256SUMS.json").write_text(json.dumps({"files": records}, indent=2) + "\n")
          PY
          (cd "$OUT" && zip -qr ../AI_ORB_DEMO_TAB3_REFB_OUTER_OPTICAL_FIELD_V1.zip .)
          sha256sum AI_ORB_DEMO_TAB3_REFB_OUTER_OPTICAL_FIELD_V1.zip > AI_ORB_DEMO_TAB3_REFB_OUTER_OPTICAL_FIELD_V1.zip.sha256

      - name: Preserve API36 diagnostics after failure
        if: failure()
        env:
          APP_ID: com.aistudio.aiorbdemo.vxkrmq
        shell: bash
        run: |
          mkdir -p p0_3_evidence/api36_avd/logs
          mkdir -p p0_3_evidence/api36_avd/failure_evidence p0_3_evidence/api36_avd/failure_repeatability
          adb exec-out run-as "$APP_ID" sh -c 'cd files && tar -cf - v42_fidelity_evidence' 2>/dev/null \
            | tar -xf - --strip-components=1 -C p0_3_evidence/api36_avd/failure_evidence 2>/dev/null || true
          adb exec-out run-as "$APP_ID" sh -c 'cd files && tar -cf - p0_3_repeatability' 2>/dev/null \
            | tar -xf - --strip-components=1 -C p0_3_evidence/api36_avd/failure_repeatability 2>/dev/null || true
          adb devices -l > p0_3_evidence/api36_avd/adb_devices_after_failure.txt 2>&1 || true
          adb logcat -b all -d > p0_3_evidence/api36_avd/logs/logcat_after_failure.txt 2>&1 || true
          adb shell dumpsys activity > p0_3_evidence/api36_avd/logs/activity_after_failure.txt 2>&1 || true
          adb shell dumpsys gfxinfo "$APP_ID" > p0_3_evidence/api36_avd/logs/gfxinfo_after_failure.txt 2>&1 || true
          adb shell pidof "$APP_ID" > p0_3_evidence/api36_avd/logs/application_pid_after_failure.txt 2>&1 || true
          adb exec-out screencap -p > p0_3_evidence/api36_avd/capture_failure_screen.png 2> p0_3_evidence/api36_avd/logs/screencap_after_failure.err || true

      - name: Record 20-second API36 motion run and runtime logs
        env:
          APP_ID: com.aistudio.aiorbdemo.vxkrmq
        shell: bash
        run: |
          set -euo pipefail
          adb shell am force-stop "$APP_ID"
          # Suppress Android's one-time immersive-mode education overlay so the
          # recording contains the app surface rather than the system prompt.
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell settings get secure immersive_mode_confirmations > p0_3_evidence/api36_avd/logs/immersive_mode_confirmations.txt
          test "$(tr -d '\r' < p0_3_evidence/api36_avd/logs/immersive_mode_confirmations.txt)" = "confirmed"
          date -u +%Y-%m-%dT%H:%M:%SZ > p0_3_evidence/video_start_utc.txt
          adb shell am start -W -n "$APP_ID/com.example.MainActivity" > p0_3_evidence/api36_avd/logs/activity_start_motion.txt
          grep -q 'Status: ok' p0_3_evidence/api36_avd/logs/activity_start_motion.txt
          sleep 3
          adb shell uiautomator dump /sdcard/p0_3_motion_window.xml > p0_3_evidence/api36_avd/logs/window_dump_motion.txt
          adb pull /sdcard/p0_3_motion_window.xml p0_3_evidence/api36_avd/window_motion.xml
          if grep -Eqi 'Viewing full screen|Got it' p0_3_evidence/api36_avd/window_motion.xml; then
            # The tutorial is a system overlay. Dismiss its centered confirmation
            # button at the frozen 1254x1254 AVD viewport and verify it is gone.
            adb shell input tap 867 190
            sleep 2
            adb shell uiautomator dump /sdcard/p0_3_motion_window.xml > p0_3_evidence/api36_avd/logs/window_dump_motion.txt
            adb pull /sdcard/p0_3_motion_window.xml p0_3_evidence/api36_avd/window_motion.xml
          fi
          if grep -Eqi 'Viewing full screen|Got it' p0_3_evidence/api36_avd/window_motion.xml; then
            echo "Android immersive confirmation remained visible during motion capture" >&2
            exit 1
          fi
          adb shell rm -f /sdcard/MOTION_20S.mp4
          # SwiftShader can advance much more slowly than host wall time. Avoid
          # competing screencap requests while recording. Scale the evidence
          # stream to 720p/4 Mbps to avoid exhausting API36's software encoder
          # while the full 1254x1254 app viewport remains unchanged.
          cat > p0_3_evidence/api36_avd/logs/screenrecord_config.json <<'JSON'
          {
            "captureViewport": "1254x1254",
            "videoSize": "720x720",
            "bitRate": 4000000,
            "deviceTimeLimitSeconds": 24,
            "hostTimeoutSeconds": 600
          }
          JSON
          set +e
          timeout --foreground --signal=TERM --kill-after=15s 600s adb shell screenrecord \
            --size 720x720 --bit-rate 4000000 --time-limit 24 /sdcard/MOTION_20S.mp4 \
            > p0_3_evidence/api36_avd/logs/screenrecord.log 2>&1
          SCREENRECORD_RC=$?
          set -e
          echo "$SCREENRECORD_RC" > p0_3_evidence/api36_avd/logs/screenrecord_exit_code.txt
          adb shell ls -l /sdcard/MOTION_20S.mp4 > p0_3_evidence/api36_avd/logs/remote_motion_video.txt 2>&1 || true
          test "$SCREENRECORD_RC" -eq 0
          date -u +%Y-%m-%dT%H:%M:%SZ > p0_3_evidence/video_end_utc.txt
          adb pull /sdcard/MOTION_20S.mp4 p0_3_evidence/MOTION_20S.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 p0_3_evidence/MOTION_20S.mp4 > p0_3_evidence/motion_duration_seconds.txt
          test -s p0_3_evidence/MOTION_20S.mp4
          python3 tools/orb-v3-generator/p0_3/validate_p04_motion_capture.py \
            --video p0_3_evidence/MOTION_20S.mp4 \
            --output p0_3_evidence/P04_VIDEO_CAPTURE_REPORT.json \
            --telemetry p0_3_evidence/latest_capture/RUNTIME_TELEMETRY.json
          adb logcat -b all -d > p0_3_evidence/api36_avd/logs/logcat.txt
          { grep -Eni 'GL error|GL_INVALID|GL_OUT_OF_MEMORY|shader compile failed|V3_ASSET_ERROR|FATAL EXCEPTION|ANR in' p0_3_evidence/api36_avd/logs/logcat.txt || true; } > p0_3_evidence/api36_avd/logs/gl_errors.txt
          adb shell dumpsys activity > p0_3_evidence/api36_avd/logs/activity_dump.txt
          adb shell dumpsys meminfo "$APP_ID" > p0_3_evidence/api36_avd/logs/meminfo.txt
          adb shell dumpsys gfxinfo "$APP_ID" > p0_3_evidence/api36_avd/logs/gfxinfo_after_motion.txt

      - name: Preserve motion recorder diagnostics after failure
        if: failure()
        shell: bash
        run: |
          mkdir -p p0_3_evidence/api36_avd/logs
          adb devices -l > p0_3_evidence/api36_avd/adb_devices_after_motion_failure.txt 2>&1 || true
          adb shell ls -l /sdcard/MOTION_20S.mp4 > p0_3_evidence/api36_avd/logs/remote_motion_video_after_failure.txt 2>&1 || true
          adb pull /sdcard/MOTION_20S.mp4 p0_3_evidence/MOTION_20S_partial.mp4 2>&1 || true
          adb shell ps -A > p0_3_evidence/api36_avd/logs/processes_after_motion_failure.txt 2>&1 || true
          adb logcat -b all -d > p0_3_evidence/api36_avd/logs/logcat_after_motion_failure.txt 2>&1 || true

      - name: Analyze PF02-PF05 runtime and produce evidence archives
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tools/orb-v3-generator/p0_3/analyze_avd_baseline.py \
            --evidence-dir p0_3_evidence \
            --expected-apk exact-head/AI-Orb-Demo-V4.2-Core-Fidelity-Final-debug.apk \
            --expected-head "$EXPECTED_HEAD_SHA"

      - name: P0_4_METRIC_VALIDATION
        run: |
          python3 tools/orb-v3-generator/p0_3/validate_p04_metrics.py \
            --evidence-dir p0_3_evidence/repeats/baseline_1 \
            --historical-report docs/p0_3/VISUAL_DIFF_REPORT.json \
            --output docs/p0_3/P04_METRIC_VALIDATION_REPORT.json \
            --expected-head "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Upload API36 baseline and PF05 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-orb-tab3-refb-api36-exact-head-${{ github.run_id }}
          path: |
            p0_3_evidence/**
            docs/p0_3/P0_3_PREFLIGHT_REPORT.json
            docs/p0_3/ROI_MASK_FREEZE_MANIFEST.json
            docs/p0_3/PF02_RAYMARCH_RUNTIME_EVIDENCE.json
            docs/p0_3/PF03_GEOMETRY_RUNTIME_EVIDENCE.json
            docs/p0_3/PF05_REPEATABILITY_REPORT.json
            docs/p0_3/VISUAL_DIFF_REPORT.json
            docs/p0_3/VISUAL_DIFF_CONTACT_SHEET.png
            docs/p0_3/VISUAL_DIFF_HEATMAPS/**
            docs/p0_3/P04_METRIC_VALIDATION_REPORT.json
            AI_ORB_DEMO_TAB3_REFB_OUTER_OPTICAL_FIELD_V1.zip
            AI_ORB_DEMO_TAB3_REFB_OUTER_OPTICAL_FIELD_V1.zip.sha256
            AI_ORB_DEMO_TAB3_REFB_OUTER_OPTICAL_FIELD_V1_DELIVERY/**
          if-no-files-found: warn
