name: Water World V2.1 Work 3.1 Core 3D Volume GPU Closure CI

on:
  push:
    branches:
      - main
      - 'work/water-world-v2-1-work3-1-core-3d-gpu-closure'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  work3-1-core3d-android-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Frozen Resources & 32 Spatial Z-Slice Assets
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          def sha(p):
              return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          checks = {
              "releases/water-world-v2-v21/奇幻水晶球中的水下生态世界 (1).png": "fef8225a7322aa9edf77d2c753efe51af2189384e757eb0e974a68a88f44c589",
              "releases/water-world-v2/WATER_WORLD_V2_ASSETS.zip": "6b85708fc5eccf8f5c130b1d9c48bfd59abc829b178db9dd0729b4ef7b065095",
          }
          for path, expected in checks.items():
              p = pathlib.Path(path)
              assert p.is_file(), f"Missing frozen asset: {path}"
              actual = sha(path)
              assert actual == expected, f"Frozen SHA mismatch for {path}: {actual} != {expected}"
          v21_zip = pathlib.Path("releases/water-world-v2-v21/delivery/WATER_WORLD_V2_1_ASSETS.zip")
          if v21_zip.is_file():
              assert sha(v21_zip) == "28f8918c39f6e875602d3a7e90775e9d455aa6c4e42783247d1104c3b4509679"
          else:
              sha_lock = pathlib.Path("releases/water-world-v2-v21/delivery/WATER_WORLD_V2_1_ASSETS.zip.sha256").read_text()
              assert "28f8918c39f6e875602d3a7e90775e9d455aa6c4e42783247d1104c3b4509679" in sha_lock

          manifest_path = pathlib.Path("app/src/main/assets/orb_v3/manifest/ORB_V3_ASSET_MANIFEST.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          vol = manifest["volume"]
          assert vol["width"] == 256 and vol["height"] == 256 and vol["depth"] == 32
          assert vol["gpuTarget"] == "GL_TEXTURE_3D"
          assert len(vol["slices"]) == 32
          for idx, entry in enumerate(vol["slices"]):
              assert entry["zIndex"] == idx
              p = pathlib.Path("app/src/main/assets/orb_v3") / entry["path"]
              assert p.is_file() and p.stat().st_size > 100, f"Missing Z-slice: {p}"
              assert sha(p) == entry["sha256"], f"Z-slice SHA mismatch for {p}"
          print("ALL_FROZEN_ASSETS_AND_32_Z_SLICES_VERIFIED_PASS")
          PY
          python3 tools/water-world-scene-assembly/verify_android_asset_plan.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36.1
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER_PATH="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER_PATH" ]; then
            SDKMANAGER_PATH="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER_PATH" ]; then
            curl --fail --location --retry 2 --output /tmp/ww-android-cmdline.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            mkdir -p "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest"
            unzip -q /tmp/ww-android-cmdline.zip -d /tmp/ww-android-tools
            mv /tmp/ww-android-tools/cmdline-tools/* "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/"
            SDKMANAGER_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER_PATH"
          printf 'y\n%.0s' {1..50} | "$SDKMANAGER_PATH" --licenses >/dev/null
          "$SDKMANAGER_PATH" --install 'platforms;android-36.1' 'build-tools;36.0.0'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create CI-only debug signing key
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Compile Debug, AndroidTest, and Release Kotlin
        run: gradle :app:assembleDebug :app:assembleAndroidTest :app:compileReleaseKotlin --no-daemon --console=plain

      - name: Run Work 3.1 Core 3D + Work 3 + Work 2 + Tab 1/Tab 2 Regression Tests & Lint
        run: |
          gradle :app:testDebugUnitTest \
            --tests "com.example.WaterWorldCore3DAdapterTest" \
            --tests "com.example.WaterWorldCore3DVolumeAssetsTest" \
            --tests "com.example.WaterWorldCore3DRendererIntegrationTest" \
            --tests "com.example.WaterWorld*" \
            --tests "com.example.ExistingOrbTabRegressionTest" \
            --tests "com.example.AIOrbIntegrationRobolectricTest" \
            --tests "com.example.AIOrbV31StructuralParityTest" \
            --tests "com.example.AIOrbV3G0G4ParityCloseoutTest" \
            :app:lintDebug --no-daemon --console=plain

      - name: Audit Packaged Debug APK & Bundle Exact-HEAD Work 3.1 Deliverables
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, zipfile

          merged_manifest = pathlib.Path("app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml")
          assert merged_manifest.is_file(), f"Missing merged manifest: {merged_manifest}"
          manifest_xml = merged_manifest.read_text(encoding="utf-8")
          assert "com.example.waterworld.WaterWorldPreviewActivity" in manifest_xml
          assert "com.example.MainActivity" in manifest_xml
          for bad in ("READ_EXTERNAL_STORAGE", "WRITE_EXTERNAL_STORAGE", "MANAGE_EXTERNAL_STORAGE", "READ_MEDIA_IMAGES", "READ_MEDIA_VIDEO"):
              assert bad not in manifest_xml, f"Forbidden broad storage permission: {bad}"

          src_apk = pathlib.Path("app/build/outputs/apk/debug/app-debug.apk")
          assert src_apk.is_file(), "Debug APK missing"
          out_apk = pathlib.Path("app/build/outputs/apk/debug/AI-Orb-Demo-WaterWorld-V2.1-Work3.1-Core3D-debug.apk")
          shutil.copy2(src_apk, out_apk)

          with zipfile.ZipFile(out_apk) as z:
              names = set(z.namelist())
              slices = [n for n in names if n.startswith("assets/orb_v3/volume/fluid_color_z") and n.endswith(".webp")]
              assert len(slices) == 32, f"Expected 32 Z-slices in APK, found {len(slices)}"
              assert "assets/orb_v3/manifest/ORB_V3_ASSET_MANIFEST.json" in names
              assert "assets/water_world_v2_1/03_SCENE_GRAPH/draw_bindings.json" in names
              assert "assets/water_world_v2_1/04_MOTION/work3_motion_profile.json" in names
              reused = [n for n in names if n.startswith("assets/water_world_v2_1/01_REUSED_ASSETS/") and not n.endswith("/")]
              assert len(reused) == 65, f"Expected 65 frozen V2 assets in APK, found {len(reused)}"
              for n in names:
                  assert "奇幻水晶球中的水下生态世界" not in n, f"Forbidden master PNG leaked into APK: {n}"

          apk_sha = hashlib.sha256(out_apk.read_bytes()).hexdigest()
          pathlib.Path("app/build/outputs/apk/debug/AI-Orb-Demo-WaterWorld-V2.1-Work3.1-Core3D-debug.apk.sha256").write_text(
              f"{apk_sha}  {out_apk.name}\n"
          )

          ev_root = pathlib.Path("releases/water-world-v2-v21/work3_1_core_3d_gpu_acceptance")
          ev_zip = pathlib.Path("app/build/outputs/apk/debug/WATER_WORLD_V2_1_WORK3_1_CORE3D_SOFTWARE_EVIDENCE.zip")
          ev_count = 0
          with zipfile.ZipFile(ev_zip, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as ez:
              for f in sorted(ev_root.rglob("*")):
                  if f.is_dir() or f.suffix in (".apk", ".zip"):
                      continue
                  rel = f.relative_to(ev_root).as_posix()
                  ez.write(f, f"WATER_WORLD_V2_1_WORK3_1_CORE3D_SOFTWARE_EVIDENCE/{rel}")
                  ev_count += 1
          ev_sha = hashlib.sha256(ev_zip.read_bytes()).hexdigest()
          pathlib.Path("app/build/outputs/apk/debug/WATER_WORLD_V2_1_WORK3_1_CORE3D_SOFTWARE_EVIDENCE.zip.sha256").write_text(
              f"{ev_sha}  {ev_zip.name}\n"
          )
          print(json.dumps({
              "head": "${{ github.sha }}",
              "apk_file": out_apk.name,
              "apk_bytes": out_apk.stat().st_size,
              "apk_sha256": apk_sha,
              "evidence_zip": ev_zip.name,
              "evidence_sha256": ev_sha,
              "evidence_files": ev_count,
              "WORK3_1_HARDWARE_DYNAMIC_VERIFIED": "NOT_RUN",
          }, indent=2))
          PY

      - name: Upload Exact-HEAD Work 3.1 Debug APK & Software Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: water-world-work3-1-core3d-exact-head-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/AI-Orb-Demo-WaterWorld-V2.1-Work3.1-Core3D-debug.apk
            app/build/outputs/apk/debug/AI-Orb-Demo-WaterWorld-V2.1-Work3.1-Core3D-debug.apk.sha256
            app/build/outputs/apk/debug/WATER_WORLD_V2_1_WORK3_1_CORE3D_SOFTWARE_EVIDENCE.zip
            app/build/outputs/apk/debug/WATER_WORLD_V2_1_WORK3_1_CORE3D_SOFTWARE_EVIDENCE.zip.sha256
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
