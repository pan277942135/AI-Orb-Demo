name: Water World V2.1 Exact-HEAD Closure

on:
  push:
    branches: [assets/water-world-v2-v21-calibration]
  pull_request:
    branches: [assets/water-world-v2-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-input-closure:
    name: Source, contracts, CPU reproducibility, and frozen visual gates
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      MASTER_SHA256: fef8225a7322aa9edf77d2c753efe51af2189384e757eb0e974a68a88f44c589
      V2_ARCHIVE_SHA256: 6b85708fc5eccf8f5c130b1d9c48bfd59abc829b178db9dd0729b4ef7b065095
      PACKAGE_ZIP: releases/water-world-v2-v21/delivery/WATER_WORLD_V2_1_ASSETS.zip

    steps:
      - name: Checkout exact branch HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact HEAD and frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          MASTER='releases/water-world-v2-v21/奇幻水晶球中的水下生态世界 (1).png'
          test "$(sha256sum "$MASTER" | awk '{print $1}')" = "$MASTER_SHA256"
          test "$(stat -c %s "$MASTER")" = 2256234
          python - <<'PY'
          import struct
          from pathlib import Path
          path = 'releases/water-world-v2-v21/奇幻水晶球中的水下生态世界 (1).png'
          data = Path(path).read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          length, kind = struct.unpack('>I4s', data[8:16])
          assert length == 13 and kind == b'IHDR'
          width, height, bit_depth, color_type, compression, filter_method, interlace = struct.unpack('>IIBBBBB', data[16:29])
          assert (width, height) == (1254, 1254)
          assert color_type == 2  # RGB, no alpha channel
          print('MASTER_SOURCE_LOCK=PASS')
          PY
          test "$(sha256sum releases/water-world-v2/WATER_WORLD_V2_ASSETS.zip | awk '{print $1}')" = "$V2_ARCHIVE_SHA256"
          test -s "$PACKAGE_ZIP"

      - name: Set up Python 3.12 and pinned analysis dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-water-world-v21.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-water-world-v21.txt

      - name: Run retained preflight validator and manifest regression suite
        run: python -m unittest discover -s tools/water-world-v2-1/preflight_tests -p 'test_validate_preflight.py' -v

      - name: Run current closure unit suite
        run: python -m unittest discover -s tools/water-world-v2-1/tests -v

      - name: Compile Python validators and analysis tools
        run: python -m py_compile tools/water-world-v2-1/*.py tools/water-world-v2-1/tests/*.py tools/water-world-v2-1/preflight_tests/*.py

      - name: Extract final resource ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/water-world-v21"
          unzip -q "$PACKAGE_ZIP" -d "$RUNNER_TEMP/water-world-v21"
          echo "root=$RUNNER_TEMP/water-world-v21/WATER_WORLD_V2_1" >> "$GITHUB_OUTPUT"
          sha256sum "$PACKAGE_ZIP" | tee "$RUNNER_TEMP/water-world-v21/package.sha256"

      - name: Validate original V2 archive, source copy, and 47/28 Motion Graph
        run: |
          python tools/water-world-v2-1/validate_preflight.py \
            --zip releases/water-world-v2/WATER_WORLD_V2_ASSETS.zip \
            --package "${{ steps.package.outputs.root }}" \
            --core-repo . \
            --scope preflight

      - name: Verify independent CPU recomposition is reproducible
        run: python tools/water-world-v2-1/verify_recomposition_reproducibility.py --package-root "${{ steps.package.outputs.root }}"

      - name: Evaluate strict visual and asset closure gates
        id: closure
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tools/water-world-v2-1/validate_closure_delta.py \
            --package-root "${{ steps.package.outputs.root }}" \
            --archive "$PACKAGE_ZIP" \
            | tee "$RUNNER_TEMP/water-world-v21/closure-validation.json"

      - name: Upload source, package, and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: water-world-v21-static-input-exact-head-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ env.PACKAGE_ZIP }}
            ${{ env.PACKAGE_ZIP }}.sha256
            ${{ steps.package.outputs.root }}/06_VALIDATION/validation_manifest.json
            ${{ steps.package.outputs.root }}/06_VALIDATION/recomposition_reproducibility.json
            ${{ steps.package.outputs.root }}/06_VALIDATION/validator_test_report.md
            ${{ steps.package.outputs.root }}/03_STATIC_RECOMPOSITION/visual_metrics.json
            ${{ steps.package.outputs.root }}/03_STATIC_RECOMPOSITION/master_overlay.png
            ${{ steps.package.outputs.root }}/03_STATIC_RECOMPOSITION/difference_heatmap.png
            ${{ runner.temp }}/water-world-v21/closure-validation.json
            ${{ runner.temp }}/water-world-v21/package.sha256

      - name: Enforce frozen visual acceptance gates
        if: steps.closure.outcome == 'failure'
        run: |
          echo 'Frozen object-level visual or package closure gates failed; evidence was uploaded.'
          exit 1
