name: Water World V2.1 Work 3 Dynamic Runtime Android CI
on:
  push:
    branches: [main, feat/water-world-v21-work3-dynamic-runtime]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  work3-dynamic-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen Master PNG, V2/V2.1 ZIP SHAs & asset plan
        run: |
          python - <<'PY'
          import hashlib, pathlib
          expected = {
              'releases/water-world-v2-v21/奇幻水晶球中的水下生态世界 (1).png': 'fef8225a7322aa9edf77d2c753efe51af2189384e757eb0e974a68a88f44c589',
              'releases/water-world-v2/WATER_WORLD_V2_ASSETS.zip': '6b85708fc5eccf8f5c130b1d9c48bfd59abc829b178db9dd0729b4ef7b065095',
              'releases/water-world-v2-v21/delivery/WATER_WORLD_V2_1_ASSETS.zip': '28f8918c39f6e875602d3a7e90775e9d455aa6c4e42783247d1104c3b4509679',
          }
          for rel, exp in expected.items():
              p = pathlib.Path(rel)
              assert p.is_file(), f'Missing frozen asset: {rel}'
              actual = hashlib.sha256(p.read_bytes()).hexdigest()
              assert actual == exp, f'Frozen asset SHA mismatch for {rel}: {actual} != {exp}'
          print('FROZEN_ASSET_SHA_CHECK_PASS')
          PY
          python tools/water-world-scene-assembly/audit_work16_ground_truth.py
          python tools/water-world-scene-assembly/verify_android_asset_plan.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36.1
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER_PATH="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER_PATH" ]; then
            SDKMANAGER_PATH="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER_PATH" ]; then
            curl --fail --location --retry 2 --output /tmp/ww-android-cmdline.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            mkdir -p "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest"
            unzip -q /tmp/ww-android-cmdline.zip -d /tmp/ww-android-tools
            mv /tmp/ww-android-tools/cmdline-tools/* "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/"
            SDKMANAGER_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER_PATH"
          printf 'y\n%.0s' {1..50} | "$SDKMANAGER_PATH" --licenses >/dev/null
          "$SDKMANAGER_PATH" --install 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Create CI-only debug signing key
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000
      - name: Compile Debug, AndroidTest, and Release Kotlin
        run: gradle :app:assembleDebug :app:assembleAndroidTest :app:compileReleaseKotlin --no-daemon --console=plain
      - name: Run All 6 Work 3 Tests + Work 1.6/Work 2/Tab 1/Tab 2 Regressions & Lint
        run: |
          gradle :app:testDebugUnitTest \
            --tests "com.example.WaterWorldMotionTimelineTest" \
            --tests "com.example.WaterWorldMotionEvaluatorTest" \
            --tests "com.example.WaterWorldMotionRuntimeTest" \
            --tests "com.example.WaterWorldDynamicRendererTest" \
            --tests "com.example.WaterWorldDynamicPlaybackLifecycleTest" \
            --tests "com.example.WaterWorldDynamicDeterminismTest" \
            --tests "com.example.WaterWorld*" \
            --tests "com.example.ExistingOrbTabRegressionTest" \
            --tests "com.example.AIOrbIntegrationRobolectricTest" \
            :app:lintDebug --no-daemon --console=plain
      - name: Audit Packaged Debug APK Internals & Bundle Work 3 Exact-HEAD Deliverables
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib, json, shutil

          merged_manifest = Path('app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml')
          assert merged_manifest.exists(), f'Missing merged debug manifest: {merged_manifest}'
          manifest_xml = merged_manifest.read_text(encoding='utf-8')
          assert 'com.example.waterworld.WaterWorldPreviewActivity' in manifest_xml
          assert 'com.example.MainActivity' in manifest_xml and 'android.intent.category.LAUNCHER' in manifest_xml
          for forbidden_perm in ['READ_EXTERNAL_STORAGE', 'WRITE_EXTERNAL_STORAGE', 'READ_MEDIA_IMAGES', 'READ_MEDIA_VIDEO']:
              assert forbidden_perm not in manifest_xml, f'Forbidden broad storage permission found: {forbidden_perm}'

          src_apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          assert src_apk.is_file(), f'Missing APK: {src_apk}'
          work3_apk = Path('app/build/outputs/apk/debug/AI-Orb-Demo-WaterWorld-V2.1-Work3-Dynamic-debug.apk')
          shutil.copy2(src_apk, work3_apk)

          with ZipFile(work3_apk) as z:
              names = set(z.namelist())
              prefix = 'assets/water_world_v2_1/'
              assert prefix + '04_MOTION/work3_motion_profile.json' in names, 'Missing Work 3 motion profile in APK'
              src_profile = Path('releases/water-world-v2-v21/work3_full_dynamic_runtime/02_MOTION/work3_motion_profile.json').read_bytes()
              assert hashlib.sha256(z.read(prefix + '04_MOTION/work3_motion_profile.json')).digest() == hashlib.sha256(src_profile).digest()
              reused = [x for x in names if x.startswith(prefix + '01_REUSED_ASSETS/') and not x.endswith('/')]
              assert len(reused) == 65, f'Expected 65 frozen V2 assets, found {len(reused)}'
              z_slices = [x for x in names if x.startswith('assets/orb_v3/volume/') and x.endswith('.webp')]
              assert len(z_slices) == 32, f'Expected 32 spatial Z-slices, found {len(z_slices)}'
              assert not any('奇幻水晶球中的水下生态世界' in n for n in names), 'Master PNG leaked into APK!'

          apk_sha = hashlib.sha256(work3_apk.read_bytes()).hexdigest()
          Path('app/build/outputs/apk/debug/AI-Orb-Demo-WaterWorld-V2.1-Work3-Dynamic-debug.apk.sha256').write_text(
              f'{apk_sha}  {work3_apk.name}\n'
          )

          ev_root = Path('releases/water-world-v2-v21/work3_full_dynamic_runtime')
          ev_zip = Path('app/build/outputs/apk/debug/WATER_WORLD_V2_1_WORK3_DYNAMIC_EVIDENCE.zip')
          ev_count = 0
          with ZipFile(ev_zip, 'w', compression=ZIP_DEFLATED, compresslevel=6) as ez:
              for f in sorted(ev_root.rglob('*')):
                  if f.is_dir() or f.suffix in ('.apk', '.zip'):
                      continue
                  rel = f.relative_to(ev_root).as_posix()
                  ez.write(f, f'WATER_WORLD_V2_1_WORK3_DYNAMIC_EVIDENCE/{rel}')
                  ev_count += 1
          ev_sha = hashlib.sha256(ev_zip.read_bytes()).hexdigest()
          Path('app/build/outputs/apk/debug/WATER_WORLD_V2_1_WORK3_DYNAMIC_EVIDENCE.zip.sha256').write_text(
              f'{ev_sha}  {ev_zip.name}\n'
          )
          print(json.dumps({
              'head': '${{ github.sha }}',
              'apk_file': work3_apk.name,
              'apk_sha256': apk_sha,
              'evidence_zip_file': ev_zip.name,
              'evidence_zip_sha256': ev_sha,
              'evidence_file_count': ev_count,
              'WORK3_HARDWARE_DYNAMIC_VERIFIED': 'NOT_RUN',
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: water-world-work3-dynamic-exact-head-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/AI-Orb-Demo-WaterWorld-V2.1-Work3-Dynamic-debug.apk
            app/build/outputs/apk/debug/AI-Orb-Demo-WaterWorld-V2.1-Work3-Dynamic-debug.apk.sha256
            app/build/outputs/apk/debug/WATER_WORLD_V2_1_WORK3_DYNAMIC_EVIDENCE.zip
            app/build/outputs/apk/debug/WATER_WORLD_V2_1_WORK3_DYNAMIC_EVIDENCE.zip.sha256
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
