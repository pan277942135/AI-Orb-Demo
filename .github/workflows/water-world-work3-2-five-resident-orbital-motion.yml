name: Water World V2.1 Work 3.2 Five Resident True Orbital Motion CI

on:
  push:
    branches:
      - main
      - 'feat/water-world-work3-2-five-resident-orbital-motion'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  work3-2-five-resident-orbital-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Frozen Assets, 13 Resident Meshes, 32 Z-Slices & Shader Contracts
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib

          def sha(p):
              return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()

          # 1. Verify frozen Master PNG & V2 archive
          frozen_checks = {
              "releases/water-world-v2-v21/奇幻水晶球中的水下生态世界 (1).png": "fef8225a7322aa9edf77d2c753efe51af2189384e757eb0e974a68a88f44c589",
              "releases/water-world-v2/WATER_WORLD_V2_ASSETS.zip": "6b85708fc5eccf8f5c130b1d9c48bfd59abc829b178db9dd0729b4ef7b065095",
          }
          for path, expected in frozen_checks.items():
              assert sha(path) == expected, f"Frozen SHA mismatch: {path}"

          # 2. Verify all 13 frozen Resident meshes match V1 geometry lock SHA-256
          lock = json.loads(pathlib.Path("releases/water-world-v2-v21/five_resident_filaments_v1/01_PRE_IMPLEMENTATION/five_resident_geometry_lock.json").read_text())
          scene_root = pathlib.Path("releases/water-world-v2-v21/work1_5_scene_assembly/WATER_WORLD_V2_1")
          assert len(lock["segments"]) == 13
          for seg in lock["segments"]:
              mpath = scene_root / seg["meshRelativePath"]
              assert sha(mpath) == seg["sha256"], f"Resident mesh modified: {seg['segmentId']}"

          # 3. Verify 32 Z-slice Core manifest intact
          manifest = json.loads(pathlib.Path("app/src/main/assets/orb_v3/manifest/ORB_V3_ASSET_MANIFEST.json").read_text())
          assert len(manifest["volume"]["slices"]) == 32

          # 4. Verify Work 3.2 shader & uniform guardrails
          shaders = pathlib.Path("app/src/main/java/com/example/waterworld/WaterWorldShaders.kt").read_text()
          renderer = pathlib.Path("app/src/main/java/com/example/waterworld/WaterWorldStaticRenderer.kt").read_text()
          for sym in ("uResidentOrbitMat", "uCoreCenterPx", "uCoreRadiusPx", "uResidentOrbitEnabled"):
              assert sym in shaders, f"Missing {sym} in WaterWorldShaders.kt"
              assert sym in renderer, f"Missing {sym} in WaterWorldStaticRenderer.kt"
          assert "uWaterFlowPhase" not in shaders
          assert "uWaterFlowPhase" not in renderer
          print("WORK3_2_PREFLIGHT_PASS")
          PY
          python3 tools/water-world-scene-assembly/verify_android_asset_plan.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36.1
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER_PATH="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER_PATH" ]; then
            SDKMANAGER_PATH="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER_PATH" ]; then
            curl --fail --location --retry 2 --output /tmp/ww-android-cmdline.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            mkdir -p "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest"
            unzip -q /tmp/ww-android-cmdline.zip -d /tmp/ww-android-tools
            mv /tmp/ww-android-tools/cmdline-tools/* "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/"
            SDKMANAGER_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER_PATH"
          printf 'y\n%.0s' {1..50} | "$SDKMANAGER_PATH" --licenses >/dev/null
          "$SDKMANAGER_PATH" --install 'platforms;android-36.1' 'build-tools;36.0.0'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create CI-only debug signing key
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build Debug APK, AndroidTest APK & Release Kotlin
        run: |
          mkdir -p ci_logs
          gradle :app:assembleDebug :app:assembleAndroidTest :app:compileReleaseKotlin --no-daemon --console=plain 2>&1 | tee ci_logs/build.log

      - name: Run Work 3.2 Orbital Tests, Water World Regression, Tab 1/Tab 2 Regression & Lint
        run: |
          gradle :app:testDebugUnitTest \
            --tests "com.example.WaterWorldWork32ResidentOrbitalMotionTest" \
            --tests "com.example.WaterWorldFiveResidentFilamentsV1Test" \
            --tests "com.example.WaterWorldShaderUniformContractTest" \
            --tests "com.example.WaterWorld*" \
            --tests "com.example.ExistingOrbTabRegressionTest" \
            --tests "com.example.AIOrbIntegrationRobolectricTest" \
            --tests "com.example.AIOrbV31StructuralParityTest" \
            --tests "com.example.AIOrbV3G0G4ParityCloseoutTest" \
            :app:lintDebug --no-daemon --console=plain 2>&1 | tee ci_logs/test_and_lint.log

      - name: Run Work 3.2 Software Orbital Precheck & Package Evidence ZIP
        run: |
          javac -cp tools/water-world-scene-assembly \
            tools/water-world-scene-assembly/WaterWorldSoftwareRenderer.java \
            tools/water-world-scene-assembly/WaterWorldWork32OrbitalSoftwarePrecheck.java
          java -Xmx2g -cp tools/water-world-scene-assembly WaterWorldWork32OrbitalSoftwarePrecheck 2>&1 | tee ci_logs/software_precheck.log
          python3 - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path("releases/water-world-v2-v21/work3_2_five_resident_orbital_motion/04_EVIDENCE/WORK3_2_ORBITAL_METRICS.json").read_text())
          assert m["allSoftwareGatesPass"] is True, f"Work 3.2 software gates failed: {m}"
          print("WORK3_2_SOFTWARE_GATES_PASS")
          PY

      - name: Audit Packaged Work 3.2 Debug APK & Write Exact-HEAD Manifest
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, zipfile

          src_apk = pathlib.Path("app/build/outputs/apk/debug/app-debug.apk")
          out_apk = pathlib.Path("app/build/outputs/apk/debug/AI-Orb-Demo-WaterWorld-V2.1-Work3.2-FiveResidentOrbital-debug.apk")
          shutil.copy2(src_apk, out_apk)

          with zipfile.ZipFile(out_apk) as z:
              names = set(z.namelist())
              z_slices = [n for n in names if n.startswith("assets/orb_v3/volume/fluid_color_z") and n.endswith(".webp")]
              assert len(z_slices) == 32, f"Expected 32 Z-slices, found {len(z_slices)}"
              assert "assets/orb_v3/manifest/ORB_V3_ASSET_MANIFEST.json" in names
              assert "assets/water_world_v2_1/04_MOTION/work3_motion_profile.json" in names
              assert "assets/water_world_v2_1/03_SCENE_GRAPH/draw_bindings.json" in names
              assert "assets/water_world_v2_1/02_SUPPLEMENTED_ASSETS/materials/optical_config.json" in names
              assert not any("奇幻水晶球中的水下生态世界" in n for n in names), "Master PNG must NOT be packaged into APK!"
              ww_assets = [n for n in names if n.startswith("assets/water_world_v2_1/")]
              assert len(ww_assets) >= 65, f"Expected >= 65 Water World assets, found {len(ww_assets)}"

          apk_sha = hashlib.sha256(out_apk.read_bytes()).hexdigest()
          pathlib.Path(str(out_apk) + ".sha256").write_text(f"{apk_sha}  {out_apk.name}\n")

          ev_zip = pathlib.Path("releases/water-world-v2-v21/work3_2_five_resident_orbital_motion/WATER_WORLD_V2_1_WORK3_2_TRUE_ORBITAL_EVIDENCE.zip")
          ev_sha = hashlib.sha256(ev_zip.read_bytes()).hexdigest()
          manifest = {
              "taskId": "WATER_WORLD_V2_1_WORK3_2_FIVE_RESIDENT_TRUE_ORBITAL_MOTION_V2",
              "commitSha": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}",
              "apkName": out_apk.name,
              "apkBytes": out_apk.stat().st_size,
              "apkSha256": apk_sha,
              "evidenceZipName": ev_zip.name,
              "evidenceZipBytes": ev_zip.stat().st_size,
              "evidenceZipSha256": ev_sha,
              "core32ZSlicesVerified": True,
              "masterPngExcludedVerified": True,
              "SOFTWARE_MOTION_VERIFIED": "PASS",
              "HARDWARE_GPU_VISUAL_VERIFIED": "NOT_RUN",
              "FIVE_RESIDENT_TRUE_ORBITAL_MOTION_ACCEPTED": "PENDING_HARDWARE_QA",
          }
          pathlib.Path("ci_logs/commit_sha_manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload Exact-HEAD Work 3.2 Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: water-world-work3-2-exact-head-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/AI-Orb-Demo-WaterWorld-V2.1-Work3.2-FiveResidentOrbital-debug.apk
            app/build/outputs/apk/debug/AI-Orb-Demo-WaterWorld-V2.1-Work3.2-FiveResidentOrbital-debug.apk.sha256
            releases/water-world-v2-v21/work3_2_five_resident_orbital_motion/WATER_WORLD_V2_1_WORK3_2_TRUE_ORBITAL_EVIDENCE.zip
            releases/water-world-v2-v21/work3_2_five_resident_orbital_motion/WATER_WORLD_V2_1_WORK3_2_TRUE_ORBITAL_EVIDENCE.zip.sha256
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            ci_logs/
